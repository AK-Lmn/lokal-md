# Offline-first / local-only defaults. Do not change address to 0.0.0.0 without an
# institutional security review: the app has no TLS and is meant for a single workstation.
[server]
address = "127.0.0.1"
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 200
fileWatcherType = "auto"
enableStaticServing = true

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"

[global]
developmentMode = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

# Theme tokens come from the Figma "Lokal.MD clinical workspace" frame (static/figma/tokens.json,
# regenerated by scripts/figma_tokens.py). Fonts are bundled in static/fonts - no web font loading.
[theme]
base = "light"
primaryColor = "#0b6e75"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#f1f5f7"
textColor = "#14262e"
linkColor = "#0b6e75"
borderColor = "#dce5e9"
dataframeBorderColor = "#dce5e9"
dataframeHeaderBackgroundColor = "#f8fafc"
dataframeHeaderTextColor = "#52656f"
codeBackgroundColor = "#f1f5f7"
codeTextColor = "#14262e"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "12px"
baseFontSize = 14
font = "Inter"
headingFont = "Inter"
codeFont = "IBM Plex Mono"
headingFontWeights = [700, 700, 600, 600, 600, 600]
greenColor = "#0b6e75"
greenBackgroundColor = "#edf8f6"
greenTextColor = "#0b6e75"
orangeColor = "#95520b"
orangeBackgroundColor = "#fff4e3"
orangeTextColor = "#95520b"
grayColor = "#52656f"
grayBackgroundColor = "#f1f5f7"
grayTextColor = "#52656f"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-latin-400.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-latin-500.woff2"
weight = "500"
style = "normal"

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
borderColor = "#dce5e9"
