# Offline-first / local-only defaults. Do not change address to 0.0.0.0 without an
# institutional security review: the app has no TLS and is meant for a single workstation.
[server]
address = "127.0.0.1"
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 200
fileWatcherType = "auto"
enableStaticServing = true

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"

[global]
developmentMode = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "light"
primaryColor = "#0b6e75"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#14262e"
font = "Inter"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin.woff2"
weight = "100 900"
style = "normal"
